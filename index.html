  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
  <style>
    :root{--ink:#193b35;--muted:#60756e;--line:#e2eee7}
    *{box-sizing:border-box}
    html{min-height:100%;overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth}
    body{margin:0;width:100%;min-height:100vh;font-family:"Pretendard",sans-serif;color:var(--ink);overflow-x:hidden;overflow-y:auto}
    .page-shell{width:100%;min-height:100vh;background:radial-gradient(circle at 95% 0%,#d7f2e7 0,transparent 33%),#f8faf5;position:relative;overflow:visible}
    .scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.7}
    .scene:before,.scene:after{content:"";position:absolute;border:2px solid #8fc8b4;border-radius:50%;width:75%;height:42%;right:-19%;top:2%;transform:rotate(-14deg);border-left-color:transparent;border-bottom-color:transparent}
    .scene:after{width:60%;height:27%;left:-20%;right:auto;top:auto;bottom:5%;border-color:#a7d5c2;border-top-color:transparent;border-right-color:transparent}
    .leaf{position:absolute;width:14px;height:8px;border-radius:100% 0 100% 0;background:#4e9a7d;animation:drift 20s linear infinite}
    .leaf:nth-child(1){left:12%;animation-delay:-4s}.leaf:nth-child(2){left:66%;animation-delay:-12s;background:#b06f4f}.leaf:nth-child(3){left:86%;animation-delay:-17s}
    @keyframes drift{from{transform:translateY(-10vh) rotate(0)}to{transform:translate(-4vw,110vh) rotate(330deg)}}
    .content{position:relative;z-index:1}
    .serif{font-family:Fraunces,serif}
    .tab{border:1px solid #d2e5dc;background:white;color:#46665a;transition:transform .2s}
    .tab[aria-selected=true]{background:#193b35;color:white;border-color:#193b35}
    .tab:hover,.member-card:hover{transform:translateY(-2px)}
    .member-card{width:100%;text-align:left;border:1px solid var(--line);background:white;transition:transform .2s,box-shadow .2s}
    .member-card:hover{box-shadow:0 14px 32px #204b3820}
    .avatar{background:linear-gradient(145deg,#d1efe1,#a5d6c0);color:#428b73;display:grid;place-items:center}
    .avatar svg{width:36px;height:36px;stroke-width:1.3}
    .focusable:focus-visible{outline:3px solid #287b64;outline-offset:4px}
    .field-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#71877c}
    .field-value{font-size:13px;line-height:1.4;color:#354d44;min-height:1.3em}
    .info-block{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
    .profile-copy{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;color:#354d44;font-size:14px}
    .profile-copy:empty{display:none}
    .reveal{animation:rise .36s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.reveal,.leaf{animation:none}.tab,.member-card{transition:none}}

    /* Version 29: detail page uses separate information cards; overview remains from Version 28. */
    .v29-detail-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 26px}
    .v29-detail-name{font-family:Fraunces,serif;font-size:clamp(28px,4vw,38px);line-height:1.2;font-weight:700;color:#193b35;margin:0;white-space:pre-line}
    .v29-detail-subtitle{color:#60756e;margin:8px 0 0;font-size:15px}
    .v29-detail-count{border:1px solid #d2e5dc;background:#fff;border-radius:999px;padding:9px 14px;color:#46665a;font-size:12px;font-weight:700;letter-spacing:.08em}
    .v29-fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
    .v29-field{grid-column:span 3;background:rgba(255,255,255,.94);border:1px solid #e2eee7;border-radius:20px;padding:20px;min-width:0;box-shadow:0 8px 24px rgba(32,75,56,.035)}
    .v29-field--summary{grid-column:span 2}
    .v29-field--wide{grid-column:1/-1}
    .v29-field-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;color:#193b35;font-size:15px;font-weight:800}
    .v29-field-title small{font-size:12px;color:#71877c;font-weight:600}
    .v29-bilingual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .v29-lang-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#71877c;margin:0 0 7px}
    .v29-field-value{font-size:14px;line-height:1.75;color:#354d44;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
    .v29-empty{color:#a0aaa4;font-style:italic}
    @media(max-width:640px){.v29-fields,.v29-bilingual{grid-template-columns:1fr}.v29-field,.v29-field--summary,.v29-field--wide{grid-column:1/-1}.v29-field{padding:17px}.v29-detail-head{align-items:flex-start}}
\n
    /* 사진 파일명 규칙: images/member-01.jpg ~ images/member-18.jpg. 파일이 없으면 기본 아이콘을 표시합니다. */
    /* Standalone site additions */
    .v29-search-wrap{max-width:620px;margin:0 0 28px}
    .v29-search-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#60756e;margin:0 0 8px}
    .v29-search{display:block;width:100%;border:1px solid #d2e5dc;border-radius:16px;background:#fff;color:#193b35;padding:14px 16px;font:inherit;outline:none;box-shadow:0 4px 18px #204b3808}
    .v29-search:focus{border-color:#4e9a7d;box-shadow:0 0 0 3px #86cab633}
    .v29-search-status{font-size:12px;color:#60756e;margin:8px 2px 0}
    .avatar{background:linear-gradient(145deg,#d1efe1,#a5d6c0);display:grid;place-items:center;color:#428b73}
    .avatar svg{width:44%;height:44%;stroke-width:1.3}
    .avatar{position:relative;overflow:hidden}
    .avatar-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;z-index:1}
    .v29-detail-person{display:flex;align-items:center;gap:22px;min-width:0}
    .v29-detail-photo-wrap{width:clamp(104px,16vw,156px);height:clamp(104px,16vw,156px);flex:0 0 auto;position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,#d1efe1,#a5d6c0);display:grid;place-items:center;color:#428b73}
    .v29-detail-photo-wrap svg{width:38%;height:38%;stroke-width:1.3}
    .v29-detail-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .v29-detail-name{font-family:Fraunces,serif}
    @media(max-width:520px){.v29-detail-person{align-items:flex-start;gap:14px}.v29-detail-photo-wrap{width:88px;height:88px;border-radius:20px}}
    .v29-empty{color:#9aa9a1;font-style:italic}
    .v29-motto-verse-part + .v29-motto-verse-part{margin-top:16px;padding-top:14px;border-top:1px solid #edf3ee}.v29-motto-verse-label{margin:0 0 5px;color:#71877c;font-size:11px;font-weight:800;letter-spacing:.04em}
    @media(max-width:640px){.v29-search{font-size:16px}.v29-detail-head{gap:12px;align-items:flex-start}.v29-fields{grid-template-columns:1fr}}
  </style>

con người; đặc biệt là tâm lý, cách con người suy nghĩ, hành động và xây dựng các mối quan hệ","ko":"경제, 사회, 인간에 관한 주제; 특히 심리학, 사람들이 생각하고 행동하며 관계를 맺는 방식"},{"title":"Sở thích","labelKo":"취미","vi":"Tìm tòi, nghiên cứu, học hỏi những điều mới, khám phá bản thân, đi chơi, thiên nhiên, động vật","ko":"탐구, 연구, 새로운 것 배우기, 자기 탐색, 놀러 다니기, 자연, 동물"},{"title":"Châm ngôn sống","labelKo":"삶의 좌우명","vi":"Châm ngôn 4:23","ko":"잠언 4:23"},{"title":"Câu Kinh Thánh yêu thích","labelKo":"좋아하는 성경 구절","vi":"","ko":""},{"title":"Điều làm tôi hạnh phúc","labelKo":"나를 행복하게 하는 것","vi":"- Được ai đó thực sự lắng nghe và nhớ những điều mình chia sẻ, chứ không chỉ chú ý đến những gì họ muốn nói hay nhìn theo cách muốn nhìn\n- Có những cuộc trò chuyện sâu sắc, chân thành, nơi cả hai có thể thoải mái chia sẻ suy nghĩ mà không sợ bị phán xét hay hiểu đơn giản hóa\n- Được thoải mái hát, cười, vui đùa và sống tự nhiên bên những người khiến mình cảm thấy an toàn\n- Tìm ra lời giải cho một vấn đề, liên kết lại những điều rời rạc và nhận ra những điều trước đây chưa từng nghĩ đến\n- Có thể hoàn thành hết trách nhiệm trong công việc được giao dù có mắc lỗi","ko":"- 누군가 내가 나눈 이야기를 진심으로 들어주고 기억해 주는 것 (자기가 하고 싶은 말이나 보고 싶은 방식에만 집중하지 않고)\n- 판단받거나 단순화될 걱정 없이 서로 편하게 생각을 나눌 수 있는 깊고 진솔한 대화\n- 안전하다고 느끼는 사람들 곁에서 마음껏 노래하고 웃고 장난치며 자연스럽게 지내는 것\n- 문제의 해답을 찾고, 흩어진 것들을 연결하며, 전에 생각지 못한 것을 깨닫는 것\n- 실수가 있더라도 맡은 일의 책임을 끝까지 완수하는 것"},{"title":"Điều tôi ghét","labelKo":"내가 싫어하는 것","vi":"- Bị ép phải chia sẻ, phải gần gũi hoặc phải thể hiện cảm xúc theo cách người khác mong muốn\n- Lời nói không đi đôi với hành động, nhất là những lời hứa chưa được suy nghĩ kỹ hoặc không đi kèm với trách nhiệm\n- Người khác để ý đến những khuyết điểm nhỏ của mình nhưng lại không thực sự lắng nghe những điều quan trọng mà mình chia sẻ\n- Không thể làm trọn trách nhiệm trong công việc được giao và gây ảnh hưởng tới người khác","ko":"- 다른 사람이 원하는 방식으로 나누거나 가까워지거나 감정을 표현하도록 강요받는 것\n- 말과 행동이 일치하지 않는 것, 특히 깊이 생각하지 않았거나 책임이 따르지 않는 약속\n- 내 작은 단점은 신경 쓰면서 내가 나누는 중요한 이야기는 제대로 듣지 않는 것\n- 맡은 일의 책임을 다하지 못해 다른 사람에게 영향을 주는 것"},{"title":"Ngày sinh","labelKo":"생년월일","vi":"30/07/2002 (6h15 sáng)","ko":"2002.07.30"},{"title":"Sứ mệnh","labelKo":"현재 사명 설명","vi":"KJ","ko":"하노이 기획 과장"}]},{"id":"11","nameVi":"Nguyễn Vũ Ngọc Anh","nameKo":"응웬부응옥안","fields":[{"title":"MBTI","labelKo":"MBTI","vi":"ISTP","ko":"ISTP"},{"title":"Enneagram","labelKo":"에니어그램","vi":"5\u003e3\u003e8","ko":"5\u003e3\u003e8"},{"title":"Điểm mạnh","labelKo":"강점","vi":"Tư duy sâu, ham học hỏi, có khả năng tự phản tư, quan sát tốt, trí nhớ tốt","ko":"깊은 사고, 배우려는 열정, 자기 성찰 능력, 뛰어난 관찰력, 좋은 기억력"},{"title":"Điểm yếu","labelKo":"약점","vi":"Đôi khi phân tích nhiều hơn cảm nhận; có nhiều tiêu chuẩn riêng nên dễ mất kiên nhẫn với những người chưa theo được tiêu chuẩn đó","ko":"때때로 느끼기보다 분석을 더 많이 함; 나만의 기준이 많아 그 기준을 따라오지 못하는 사람에게 쉽게 인내심을 잃음"},{"title":"Mối quan tâm","labelKo":"관심사","vi":"Phát triển bản thân, tâm lý con người, các mối quan hệ, khám phá tri thức, làm sao để làm tốt hơn sứ mệnh được giao","ko":"자기 계발, 인간 심리, 관계, 지식 탐구, 맡겨진 사명을 더 잘 감당하는 방법"},{"title":"Sở thích","labelKo":"취미","vi":"Deep talk, học hỏi tìm tòi, phân tích diễn giải, khám phá những chủ đề phức tạp và trao đổi quan điểm có chiều sâu, tạo ra những thứ xinh đẹp","ko":"깊은 대화, 배우고 탐구하기, 분석과 해석, 복잡한 주제를 탐구하고 깊이 있는 관점을 나누기, 아름다운 것을 만드는 것"},{"title":"Châm ngôn sống","labelKo":"삶의 좌우명","vi":"Miễn là Ngôi Lời thì đều thích","ko":"말씀이라면 모두 좋아함"},{"title":"Câu Kinh Thánh yêu thích","labelKo":"좋아하는 성경 구절","vi":"","ko":""},{"title":"Điều làm tôi hạnh phúc","labelKo":"나를 행복하게 하는 것","vi":"Hiểu được ý nghĩa điều mình làm và có sự chắc chắn điều mình đang làm là đúng","ko":"내가 하는 일의 의미를 이해하고 그것이 옳다는 확신이 있는 것"},{"title":"Điều tôi ghét","labelKo":"내가 싫어하는 것","vi":"Làm sai nhưng không biết vì sao mình sai","ko":"잘못했는데 왜 잘못했는지 모르는 것"},{"title":"Ngày sinh","labelKo":"생년월일","vi":"06/10/2000","ko":"2000.10.06"},{"title":"Sứ mệnh","labelKo":"현재 사명 설명","vi":"KJ","ko":"하노이 지역 문화부 과장"}]},{"id":"12","nameVi":"Nguyễn Thị Thu N         const findField = (label) => member.fields.find(field => field.labelKo === label);
        const birthday = findField('생년월일');
        const mbti = findField('MBTI');
        const enneagram = findField('에니어그램');
        const motto = findField('삶의 좌우명');
        const verse = findField('좋아하는 성경 구절');
        const excluded = new Set(['생년월일','MBTI','에니어그램','삶의 좌우명','좋아하는 성경 구절','현재 사명 설명']);
        const orderedFields = [birthday, mbti, enneagram, ...member.fields.filter(field => !excluded.has(field.labelKo))].filter(Boolean);
        const fieldsHtml = orderedFields.map((field) => {
          const wide = ['강점','약점','관심사','취미','나를 행복하게 하는 것','내가 싫어하는 것'].includes(field.labelKo);
          const summary = ['생년월일','MBTI','에니어그램'].includes(field.labelKo);
          return `<article class="v29-field ${summary ? 'v29-field--summary' : ''} ${wide ? 'v29-field--wide' : ''}">
            <h2 class="v29-field-title"><span>${escapeHtml(field.labelKo || field.title)}</span></h2>
            <p class="v29-field-value">${displayValue(field.ko)}</p>
          </article>`;
        }).join('');
        const mottoVerseHtml = (motto || verse) ? `<article class="v29-field v29-field--wide v29-motto-verse">
          <h2 class="v29-field-title"><span>삶의 좌우명 / 좋아하는 성경 구절</span></h2>
          <div class="v29-motto-verse-part"><p class="v29-motto-verse-label">삶의 좌우명</p><p class="v29-field-value">${displayValue(motto?.ko)}</p></div>
          <div class="v29-motto-verse-part"><p class="v29-motto-verse-label">좋아하는 성경 구절</p><p class="v29-field-value">${displayValue(verse?.ko)}</p></div>
        </article>` : '';
        detailContent.innerHTML = `<header class="v29-detail-head">
          <div class="v29-detail-person">
            <div class="v29-detail-photo-wrap"><i data-lucide="user-round"></i><img class="v29-detail-photo" src="images/member-${escapeHtml(member.id)}.jpg" alt="${escapeHtml(member.nameVi)} 프로필 사진" onerror="this.hidden=true"></div>
            <div><h1 class="v29-detail-name">${escapeHtml(member.nameVi)}<br><span class="v29-detail-name-ko">${escapeHtml(member.nameKo)}</span></h1>
            <p class="v29-detail-subtitle">${escapeHtml(member.fields.find(field => field.title === 'Sứ mệnh')?.ko || '')}</p></div>
          </div>
          <span class="v29-detail-count">회원 ${escapeHtml(member.id)} / 18</span>
        </header><div class="v29-fields">${fieldsHtml}${mottoVerseHtml}</div>`;
        if (window.lucide) lucide.createIcons();
      };
      document.querySelectorAll('[data-member]').forEach(card => card.addEventListener('click', () => {
        lastCard = card;
        const member = memberData.find(item => item.id === String(card.dataset.member).padStart(2, '0'));
        if (!member) return;
        renderMember(member);
        overview.classList.add('hidden');
        detail.classList.remove('hidden');
        window.scrollTo({top:0,behavior:'smooth'});
        document.getElementById('back-button').focus({preventScroll:true});
      }));
      document.getElementById('back-button').addEventListener('click', () => {
        detail.classList.add('hidden');
        overview.classList.remove('hidden');
        window.scrollTo({top:0,behavior:'smooth'});
        if (lastCard) lastCard.focus({preventScroll:true});
      });
      // Search all 18 members without changing the original group/tab structure.
      const searchInput = document.getElementById('member-search');
      const searchStatus = document.getElementById('search-status');
      const memberCards = [...document.querySelectorAll('[data-member]')];
      const initialGroup = 0;
      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLocaleLowerCase();
        let matches = 0;
        memberCards.forEach(card => {
          const haystack = card.innerText.toLocaleLowerCase();
          const show = !query || haystack.includes(query);
          card.classList.toggle('hidden', !show);
          if (show) matches++;
        });
        if (query) {
          panels.forEach(panel => {
            const hasMatch = [...panel.querySelectorAll('[data-member]')].some(card => !card.classList.contains('hidden'));
            panel.classList.toggle('hidden', !hasMatch);
          });
          tabs.forEach(tab => tab.setAttribute('aria-selected', 'false'));
          searchStatus.textContent = `검색 결과 ${matches} / ${memberCards.length}명`;
        } else {
          panels.forEach((panel, index) => panel.classList.toggle('hidden', index !== initialGroup));
          tabs.forEach((tab, index) => tab.setAttribute('aria-selected', String(index === initialGroup)));
          memberCards.forEach(card => card.classList.remove('hidden'));
          searchStatus.textContent = `회원 ${memberCards.length}명 · 카드를 선택해 프로필을 확인하세요`;
        }
      });
    });
  </script>
 
</body></html>
